name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [pf2e_core, game_core]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the SessionStart hook installs, so a local run
      # and a CI run disagree about nothing.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4

      - name: Resolve dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        run: dart test

  content:
    name: campaign content scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The scripts own part of the campaign's data; this fails if the two
      # have drifted, before the next run of the scripts undoes a hand edit.
      - name: Scripts reproduce the data
        run: python3 campaigns/shattered_seals/tools/regenerate.py --check

  app:
    name: marching_order app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/marching_order
    steps:
      - uses: actions/checkout@v4

      # The Flutter release whose Dart is the version pinned above.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable

      - name: Bundle the campaign
        run: dart run tool/sync_assets.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Test
        run: flutter test

      - name: Build for the web
        run: flutter build web --release --no-web-resources-cdn
