name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [pf2e_core, game_core]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the SessionStart hook installs, so a local run
      # and a CI run disagree about nothing.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4

      - name: Resolve dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        run: dart test
